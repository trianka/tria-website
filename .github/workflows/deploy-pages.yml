name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # On PRs: build with defaults just to validate the Dockerfile.
      # On main: build with the GitHub Pages URL and base path baked in.
      - name: Build Docker image (validate only)
        if: github.event_name == 'pull_request'
        run: docker build -t tria-website .

      - name: Build Docker image (Pages build)
        if: github.event_name != 'pull_request'
        run: |
          docker build \
            --build-arg SITE_URL=https://trianka.github.io/tria-website \
            --build-arg BASE_PATH=/tria-website \
            -t tria-website .

      - name: Extract static site from image
        if: github.event_name != 'pull_request'
        run: |
          container_id=$(docker create tria-website)
          docker cp "$container_id":/usr/share/nginx/html ./pages
          docker rm "$container_id"

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
